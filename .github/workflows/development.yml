name: Development
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-repository.mjs
      - name: Check contracts and local recovery
        run: |
          npm ci --prefix contracts --ignore-scripts
          npm run --prefix contracts typecheck
          npm run --prefix contracts test
      - name: Detect package
        id: package
        run: |
          if test -f package.json; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Local recovery checks ran above; full package/build checks await package.json.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.package.outputs.exists == 'true'
      - name: Validate library
        if: steps.package.outputs.exists == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build
          pnpm run test:package

  react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        react: ['18.3.1', '19.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix react --ignore-scripts
      - run: npm install --prefix react --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run --prefix react typecheck
      - run: npm test --prefix react
      - run: npm run --prefix react build
