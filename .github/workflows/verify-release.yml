name: Verify published npm release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify (no upload)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Verify registry metadata and installed consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-registry.mjs "$RELEASE_TAG" --require-provenance
